name: Calibration tool (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test before deploying
        run: node --test "web/test/*.test.mjs"

      - uses: actions/configure-pages@v6

      - name: Stage site (only the app and the example session, no tests)
        run: |
          mkdir -p _site/assets
          cp -r web/index.html web/css web/js _site/
          [ -d web/assets ] && cp -r web/assets/. _site/assets/ || true
          # Example session behind the "See an example result" button.
          cp web/test/fixtures/sample-session.json _site/assets/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
